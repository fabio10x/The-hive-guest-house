
<header 
  [class.bg-white]="isScrolled()" 
  [class.shadow-md]="isScrolled()" 
  [class.bg-transparent]="!isScrolled()"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 ease-in-out">
  <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a routerLink="/home" (click)="closeMenu()" class="text-2xl font-bold text-yellow-600 hover:text-yellow-700 transition-colors">
      The Hive
    </a>

    <!-- Mobile Menu Button -->
    <div class="md:hidden">
      <button (click)="toggleMenu()" class="text-stone-800 focus:outline-none">
        @if (!isMenuOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        }
      </button>
    </div>

    <!-- Desktop Menu -->
    <ul class="hidden md:flex items-center space-x-8 font-medium">
      <li>
        <a routerLink="/home" routerLinkActive="text-yellow-600" [routerLinkActiveOptions]="{exact: true}" class="hover:text-yellow-600 transition-colors">Home</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">About</a>
      </li>
      <li>
        <a routerLink="/rooms" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">Rooms</a>
      </li>
       <li>
        <a routerLink="/gallery" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">Gallery</a>
      </li>
      <li>
        <a routerLink="/contact" class="bg-yellow-500 text-white px-4 py-2 rounded-full hover:bg-yellow-600 transition-colors shadow">Contact Us</a>
      </li>
    </ul>
  </nav>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
    <div class="md:hidden absolute top-full left-0 w-full bg-white shadow-lg">
      <ul class="flex flex-col items-center py-4 space-y-4">
        <li>
          <a routerLink="/home" (click)="closeMenu()" routerLinkActive="text-yellow-600" [routerLinkActiveOptions]="{exact: true}" class="hover:text-yellow-600 transition-colors">Home</a>
        </li>
        <li>
          <a routerLink="/about" (click)="closeMenu()" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">About</a>
        </li>
        <li>
          <a routerLink="/rooms" (click)="closeMenu()" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">Rooms</a>
        </li>
         <li>
          <a routerLink="/gallery" (click)="closeMenu()" routerLinkActive="text-yellow-600" class="hover:text-yellow-600 transition-colors">Gallery</a>
        </li>
        <li>
          <a routerLink="/contact" (click)="closeMenu()" class="bg-yellow-500 text-white px-6 py-2 rounded-full hover:bg-yellow-600 transition-colors shadow-md">Contact Us</a>
        </li>
      </ul>
    </div>
  }
</header>
